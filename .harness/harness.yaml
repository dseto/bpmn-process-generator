governance:
  approval_policy: auto
  budget:
    max_tokens_per_task: 500000
    max_tool_calls_per_task: 120

  extra_allowed_commands:
    - python -m harness.cli
    - env:PYTHONPATH =
    - python scripts/verify_tests.py
    - python scripts/generate_editor_html.py
    
verification:
  enforce_tdd: false
  test_command: "python scripts/verify_tests.py"
  test_glob: "tests/**/*.py"