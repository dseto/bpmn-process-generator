<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BPMN Editor — PLACEHOLDER_PROCESS_NAME</title>
<!-- Pinned version — do not switch to @latest. Bump this string deliberately if a newer bpmn-js is needed. -->
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.0/dist/assets/diagram-js.css" />
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.0/dist/assets/bpmn-font/css/bpmn.css" />
<script src="https://unpkg.com/bpmn-js@17.0.0/dist/bpmn-modeler.production.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: #1a1a1a; color: #fff;
    overflow-x: auto; white-space: nowrap;
  }
  #toolbar span.title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-right: 4px; }
  #toolbar span.proc-name { font-size: 12px; opacity: 0.7; margin-left: auto; }
  .toolbar-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 2px; }
  button {
    background: #2b6cb0; color: #fff; border: none; border-radius: 4px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 4px; transition: background 0.15s;
  }
  button:hover { background: #2c5282; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.btn-sec { background: #334155; }
  button.btn-sec:hover { background: #475569; }
  button.btn-accent { background: #4338ca; }
  button.btn-accent:hover { background: #3730a3; }
  #canvas { height: calc(100% - 42px); }
  #error-banner {
    display: none; background: #c53030; color: #fff; padding: 10px 12px;
    font-size: 13px; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="title">BPMN Editor</span>
    <button id="btn-download" title="Download BPMN XML">💾 Download</button>
    <button id="btn-export-svg" class="btn-sec" title="Export SVG vector image">🖼️ SVG</button>
    <button id="btn-reset" class="btn-sec" title="Reset to original XML">🔄 Reset</button>

    <div class="toolbar-sep"></div>

    <button id="btn-undo" class="btn-sec" title="Undo (Ctrl+Z)" disabled>↩️</button>
    <button id="btn-redo" class="btn-sec" title="Redo (Ctrl+Y)" disabled>↪️</button>

    <div class="toolbar-sep"></div>

    <button id="btn-route-90" class="btn-accent" title="Align selected connection(s) or all connections to 90-degree orthogonal curves">📐 Curva 90°</button>

    <div class="toolbar-sep"></div>

    <button id="btn-zoom-out" class="btn-sec" title="Zoom Out">➖</button>
    <button id="btn-zoom-in" class="btn-sec" title="Zoom In">➕</button>
    <button id="btn-zoom-fit" class="btn-sec" title="Fit to Viewport">🎯 Fit</button>

    <span class="proc-name">PLACEHOLDER_PROCESS_NAME</span>
  </div>
  <div id="error-banner"></div>
  <div id="canvas"></div>

<script>
  // The generated .bpmn file's XML, embedded so this HTML keeps working even if
  // separated from the original .bpmn file. Regenerate this file if the source changes.
  //
  // ENCODING CONTRACT for whatever generates this file — read carefully, this is DOUBLE
  // JSON-encoded on purpose, a single encoding is NOT enough (see note below):
  //
  //   1. innerJson  = JSON.stringify(xmlString)
  //   2. outerJson  = JSON.stringify(innerJson)
  //   3. content    = outerJson with its own leading/trailing '"' delimiter characters
  //                   stripped (outerJson always starts and ends with an unescaped '"',
  //                   so a plain slice(1, -1) is always safe here)
  //   4. content    = content with every "</script" substring (case-insensitive) replaced
  //                   with "<\/script"
  //   5. Substitute `content` for the PLACEHOLDER_BPMN_XML_JSON token below, IN PLACE —
  //      do not touch the surrounding "..." on this line, they stay as-is.
  //
  // Why a template literal (backtick string) is not safe: real BPMN XML routinely contains
  // ${expression} syntax (standard Camunda/Flowable conditionExpression syntax), literal
  // backticks (e.g. in bpmn:documentation text), and potentially a literal script-closing
  // tag sequence (also possible inside documentation text) — any one of those inside a
  // template literal either throws a JS ReferenceError/SyntaxError or ends this whole
  // element's raw text early, producing a blank page.
  //
  // CAUTION FOR ANYONE EDITING THIS COMMENT BLOCK ITSELF: never spell out the literal
  // angle-bracket tag sequence for "closing script tag" or "opening script tag" in here —
  // the HTML tokenizer matches those character sequences inside this element's raw text
  // regardless of them being inside a JS comment, and will split this element into multiple
  // fragments, silently orphaning every real line of code below as inert unexecuted text.
  // (This exact mistake shipped once already and was caught by an end-to-end browser test,
  // not by reading the source — reading it looks fine. Only opening the rendered file in an
  // actual browser reveals the split. If you must reference that tag sequence, break it up,
  // e.g. spell it with a non-adjacent character in between, the way the JSON-escaping logic
  // above already has to for the same reason.)
  //
  // Why DOUBLE encoding, not a single JSON.stringify(xmlString) dropped straight into the
  // JSON.parse("...") call below: a single JSON.stringify(xmlString) already consumes its
  // own delimiting quotes when the JS engine parses the surrounding "..." string literal —
  // by the time that literal is decoded, the result is xmlString itself with no quoting left,
  // and JSON.parse() on that raw text throws ("is not valid JSON"). Encoding twice means the
  // JS engine's string-literal decoding only peels off the OUTER layer, leaving a properly
  // quoted JSON string for JSON.parse() to decode into xmlString at runtime. (Verified via a
  // real browser test: a single encoding throws a SyntaxError; the double encoding above
  // round-trips a test string containing a backtick and a ${foo} sequence correctly.)
  const ORIGINAL_BPMN_XML = JSON.parse("PLACEHOLDER_BPMN_XML_JSON");

  const errorBanner = document.getElementById('error-banner');
  const btnUndo = document.getElementById('btn-undo');
  const btnRedo = document.getElementById('btn-redo');

  function showError(err) {
    errorBanner.style.display = 'block';
    errorBanner.textContent = 'Failed to render diagram: ' + (err && err.message ? err.message : err);
  }

  function clearError() {
    errorBanner.style.display = 'none';
    errorBanner.textContent = '';
  }

  // Guard against the CDN failing to load (offline, corporate proxy, transient CDN
  // issue). Without this, `new BpmnJS(...)` below would throw a raw ReferenceError
  // before the error-banner machinery ever runs, leaving a silent blank page instead
  // of a helpful message. We show the message and stop here (no throw) so the rest
  // of the page — toolbar, banner — stays intact and readable.
  if (typeof BpmnJS === 'undefined') {
    errorBanner.style.display = 'block';
    errorBanner.textContent = 'Could not load the bpmn-js library from the CDN — check your internet connection and reload.';
  } else {
    // Custom rule module to enable task resizing
    const CustomResizeModule = {
      __init__: ['customResizeRules'],
      customResizeRules: ['type', function(eventBus) {
        function canResizeTask(context) {
          if (!context) return;
          const shape = context.shape;
          if (!shape) return;
          const type = shape.type;
          if (type && (type.indexOf('Task') !== -1 || type === 'bpmn:Activity' || type === 'bpmn:CallActivity')) {
            const newBounds = context.newBounds;
            if (!newBounds) return true;
            return newBounds.width >= 70 && newBounds.height >= 50;
          }
        }

        eventBus.on('commandStack.shape.resize.canExecute', 1500, function(event) {
          return canResizeTask(event.context);
        });

        eventBus.on('shape.resize', 1500, function(context) {
          return canResizeTask(context);
        });
      }]
    };

    const modeler = new BpmnJS({
      container: '#canvas',
      keyboard: { bindTo: document },
      gridSnapping: { active: true },
      additionalModules: [
        CustomResizeModule
      ]
    });

    function updateUndoRedo() {
      try {
        const cs = modeler.get('commandStack');
        btnUndo.disabled = !cs.canUndo();
        btnRedo.disabled = !cs.canRedo();
      } catch (e) {}
    }

    modeler.on('commandStack.changed', updateUndoRedo);

    async function loadXML(xml) {
      try {
        const result = await modeler.importXML(xml);
        if (result.warnings && result.warnings.length) {
          console.warn('bpmn-js import warnings:', result.warnings);
        }
        clearError();
        updateUndoRedo();
      } catch (err) {
        showError(err);
        return;
      }
      setTimeout(() => {
        try {
          modeler.get('canvas').zoom('fit-viewport');
        } catch (err) {
          console.warn('fit-viewport failed (diagram still imported correctly):', err);
        }
      }, 100);
    }

    document.getElementById('btn-download').addEventListener('click', async () => {
      try {
        const { xml } = await modeler.saveXML({ format: true });
        const blob = new Blob([xml], { type: 'application/xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'PLACEHOLDER_PROCESS_NAME.bpmn';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById('btn-export-svg').addEventListener('click', async () => {
      try {
        const { svg } = await modeler.saveSVG({ format: true });
        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'PLACEHOLDER_PROCESS_NAME.svg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => loadXML(ORIGINAL_BPMN_XML));

    btnUndo.addEventListener('click', () => {
      try {
        const cs = modeler.get('commandStack');
        if (cs.canUndo()) cs.undo();
      } catch (e) {}
    });

    btnRedo.addEventListener('click', () => {
      try {
        const cs = modeler.get('commandStack');
        if (cs.canRedo()) cs.redo();
      } catch (e) {}
    });

    document.getElementById('btn-route-90').addEventListener('click', () => {
      try {
        const selection = modeler.get('selection').get();
        const modeling = modeler.get('modeling');
        const connections = selection.filter(el => el.waypoints);
        if (connections.length > 0) {
          connections.forEach(conn => modeling.layoutConnection(conn));
        } else {
          const elementRegistry = modeler.get('elementRegistry');
          const allConns = elementRegistry.filter(el => el.waypoints && (el.type === 'bpmn:SequenceFlow' || el.type === 'bpmn:MessageFlow' || el.type === 'bpmn:Association'));
          allConns.forEach(conn => modeling.layoutConnection(conn));
        }
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      try {
        const canvas = modeler.get('canvas');
        canvas.zoom(canvas.zoom() * 1.25);
      } catch (e) {}
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      try {
        const canvas = modeler.get('canvas');
        canvas.zoom(canvas.zoom() * 0.8);
      } catch (e) {}
    });

    document.getElementById('btn-zoom-fit').addEventListener('click', () => {
      try {
        modeler.get('canvas').zoom('fit-viewport');
      } catch (e) {}
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      const isCtrlOrMeta = e.ctrlKey || e.metaKey;
      if (isCtrlOrMeta && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        try { modeler.get('commandStack').undo(); } catch (err) {}
      } else if (isCtrlOrMeta && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
        e.preventDefault();
        try { modeler.get('commandStack').redo(); } catch (err) {}
      }
    });

    loadXML(ORIGINAL_BPMN_XML);
  }
</script>
</body>
</html>
