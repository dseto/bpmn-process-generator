<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BPMN Editor — PLACEHOLDER_PROCESS_NAME</title>
<!-- Pinned version — do not switch to @latest. Bump this string deliberately if a newer bpmn-js is needed. -->
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.0/dist/assets/diagram-js.css" />
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.0/dist/assets/bpmn-font/css/bpmn.css" />
<script src="https://unpkg.com/bpmn-js@17.0.0/dist/bpmn-modeler.production.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 6px;
    padding: 6px 12px;
    background: #1a1a1a;
    color: #fff;
    min-height: 42px;
    height: auto;
    position: relative;
    z-index: 100;
    flex-shrink: 0;
    overflow-x: auto;
  }
  #toolbar::-webkit-scrollbar { height: 6px; }
  #toolbar::-webkit-scrollbar-track { background: #1a1a1a; }
  #toolbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  #toolbar span.title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-right: 4px; flex-shrink: 0; }
  #toolbar span.proc-name { font-size: 12px; opacity: 0.7; margin-left: auto; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .toolbar-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 2px; flex-shrink: 0; }
  button {
    background: #2b6cb0; color: #fff; border: none; border-radius: 4px;
    padding: 5px 8px; font-size: 12px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 4px; transition: background 0.15s; white-space: nowrap;
    line-height: 1.2;
  }
  button:hover { background: #2c5282; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.btn-sec { background: #334155; }
  button.btn-sec:hover { background: #475569; }
  button.btn-accent { background: #4338ca; }
  button.btn-accent:hover { background: #3730a3; }
  button.active { background: #2563eb !important; color: #fff !important; border-color: #38bdf8 !important; box-shadow: 0 0 6px rgba(56, 189, 248, 0.4); }
  .btn-font-toggle { font-weight: 700; min-width: 28px; justify-content: center; }
  select { background: #334155; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 4px 8px; font-size: 12px; outline: none; }
  #canvas { flex: 1 1 auto; width: 100%; min-height: 0; position: relative; }
  #error-banner {
    display: none; position: fixed; top: 50px; left: 20px; right: 20px;
    background: #c53030; color: #fff; padding: 10px 12px;
    font-size: 13px; white-space: pre-wrap; z-index: 2500; border-radius: 6px;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0f172a;
    color: #fff;
    border: 1px solid #38bdf8;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    z-index: 3000;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s ease-in-out;
    pointer-events: none;
  }
  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="title">BPMN Editor</span>
    <button id="btn-download" title="Download BPMN XML">💾 Download</button>
    <button id="btn-export-svg" class="btn-sec" title="Export SVG vector image">🖼️ SVG</button>
    <button id="btn-reset" class="btn-sec" title="Reset to original XML">🔄 Reset</button>

    <div class="toolbar-sep"></div>

    <button id="btn-undo" class="btn-sec" title="Undo (Ctrl+Z)" disabled>↩️</button>
    <button id="btn-redo" class="btn-sec" title="Redo (Ctrl+Y)" disabled>↪️</button>

    <div class="toolbar-sep"></div>

    <button id="btn-route-90" class="btn-accent" title="Align selected connection(s) or all connections to 90-degree orthogonal curves">📐 Curva 90°</button>

    <div class="toolbar-sep"></div>

    <span style="font-size: 11px; opacity: 0.7;">Fonte:</span>
    <select id="font-size-select" title="Alterar tamanho da fonte">
      <option value="9px">9px</option>
      <option value="10px">10px</option>
      <option value="11px">11px</option>
      <option value="12px" selected>12px (Padrão)</option>
      <option value="13px">13px</option>
      <option value="14px">14px</option>
      <option value="16px">16px</option>
      <option value="18px">18px</option>
      <option value="20px">20px</option>
    </select>
    <button id="btn-font-bold" class="btn-sec btn-font-toggle" title="Alternar Negrito (Ctrl+B)"><b>B</b></button>
    <button id="btn-font-italic" class="btn-sec btn-font-toggle" title="Alternar Itálico (Ctrl+I)"><i>I</i></button>

    <div class="toolbar-sep"></div>

    <button id="btn-zoom-out" class="btn-sec" title="Zoom Out">➖</button>
    <button id="btn-zoom-in" class="btn-sec" title="Zoom In">➕</button>
    <button id="btn-zoom-fit" class="btn-sec" title="Fit to Viewport">🎯 Fit</button>

    <span class="proc-name">PLACEHOLDER_PROCESS_NAME</span>
  </div>
  <div id="error-banner"></div>
  <div id="canvas"></div>
  <div id="toast"></div>

<script>
  // The generated .bpmn file's XML, embedded so this HTML keeps working even if
  // separated from the original .bpmn file. Regenerate this file if the source changes.
  //
  // ENCODING CONTRACT for whatever generates this file — read carefully, this is DOUBLE
  // JSON-encoded on purpose, a single encoding is NOT enough (see note below):
  //
  //   1. innerJson  = JSON.stringify(xmlString)
  //   2. outerJson  = JSON.stringify(innerJson)
  //   3. content    = outerJson with its own leading/trailing '"' delimiter characters
  //                   stripped (outerJson always starts and ends with an unescaped '"',
  //                   so a plain slice(1, -1) is always safe here)
  //   4. content    = content with every "</script" substring (case-insensitive) replaced
  //                   with "<\/script"
  //   5. Substitute `content` for the PLACEHOLDER_BPMN_XML_JSON token below, IN PLACE —
  //      do not touch the surrounding "..." on this line, they stay as-is.
  //
  // Why a template literal (backtick string) is not safe: real BPMN XML routinely contains
  // ${expression} syntax (standard Camunda/Flowable conditionExpression syntax), literal
  // backticks (e.g. in bpmn:documentation text), and potentially a literal script-closing
  // tag sequence (also possible inside documentation text) — any one of those inside a
  // template literal either throws a JS ReferenceError/SyntaxError or ends this whole
  // element's raw text early, producing a blank page.
  //
  // CAUTION FOR ANYONE EDITING THIS COMMENT BLOCK ITSELF: never spell out the literal
  // angle-bracket tag sequence for "closing script tag" or "opening script tag" in here —
  // the HTML tokenizer matches those character sequences inside this element's raw text
  // regardless of them being inside a JS comment, and will split this element into multiple
  // fragments, silently orphaning every real line of code below as inert unexecuted text.
  // (This exact mistake shipped once already and was caught by an end-to-end browser test,
  // not by reading the source — reading it looks fine. Only opening the rendered file in an
  // actual browser reveals the split. If you must reference that tag sequence, break it up,
  // e.g. spell it with a non-adjacent character in between, the way the JSON-escaping logic
  // above already has to for the same reason.)
  //
  // Why DOUBLE encoding, not a single JSON.stringify(xmlString) dropped straight into the
  // JSON.parse("...") call below: a single JSON.stringify(xmlString) already consumes its
  // own delimiting quotes when the JS engine parses the surrounding "..." string literal —
  // by the time that literal is decoded, the result is xmlString itself with no quoting left,
  // and JSON.parse() on that raw text throws ("is not valid JSON"). Encoding twice means the
  // JS engine's string-literal decoding only peels off the OUTER layer, leaving a properly
  // quoted JSON string for JSON.parse() to decode into xmlString at runtime. (Verified via a
  // real browser test: a single encoding throws a SyntaxError; the double encoding above
  // round-trips a test string containing a backtick and a ${foo} sequence correctly.)
  const ORIGINAL_BPMN_XML = JSON.parse("PLACEHOLDER_BPMN_XML_JSON");

  const errorBanner = document.getElementById('error-banner');
  const btnUndo = document.getElementById('btn-undo');
  const btnRedo = document.getElementById('btn-redo');
  const fontSizeSelect = document.getElementById('font-size-select');
  const btnFontBold = document.getElementById('btn-font-bold');
  const btnFontItalic = document.getElementById('btn-font-italic');
  const toast = document.getElementById('toast');

  let elementFontStyles = {};

  function showToast(msg) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2800);
  }

  function showError(err) {
    errorBanner.style.display = 'block';
    errorBanner.textContent = 'Failed to render diagram: ' + (err && err.message ? err.message : err);
  }

  function clearError() {
    errorBanner.style.display = 'none';
    errorBanner.textContent = '';
  }

  // Guard against the CDN failing to load (offline, corporate proxy, transient CDN
  // issue). Without this, `new BpmnJS(...)` below would throw a raw ReferenceError
  // before the error-banner machinery ever runs, leaving a silent blank page instead
  // of a helpful message. We show the message and stop here (no throw) so the rest
  // of the page — toolbar, banner — stays intact and readable.
  if (typeof BpmnJS === 'undefined') {
    errorBanner.style.display = 'block';
    errorBanner.textContent = 'Could not load the bpmn-js library from the CDN — check your internet connection and reload.';
  } else {
    // Custom rule module to enable task resizing
    const CustomResizeModule = {
      __init__: ['customResizeRules'],
      customResizeRules: ['type', function(eventBus) {
        function canResizeTask(context) {
          if (!context) return;
          const shape = context.shape;
          if (!shape) return;
          const type = shape.type;
          if (type && (type.indexOf('Task') !== -1 || type === 'bpmn:Activity' || type === 'bpmn:CallActivity')) {
            const newBounds = context.newBounds;
            if (!newBounds) return true;
            return newBounds.width >= 70 && newBounds.height >= 50;
          }
        }

        eventBus.on('commandStack.shape.resize.canExecute', 1500, function(event) {
          return canResizeTask(event.context);
        });

        eventBus.on('shape.resize', 1500, function(context) {
          return canResizeTask(context);
        });
      }]
    };

    const modeler = new BpmnJS({
      container: '#canvas',
      keyboard: { bindTo: document },
      gridSnapping: { active: true },
      additionalModules: [
        CustomResizeModule
      ]
    });

    function updateUndoRedo() {
      try {
        const cs = modeler.get('commandStack');
        btnUndo.disabled = !cs.canUndo();
        btnRedo.disabled = !cs.canRedo();
      } catch (e) {}
    }

    modeler.on('commandStack.changed', () => {
      updateUndoRedo();
      applyDiagramFont();
    });

    modeler.on('selection.changed', (e) => {
      updateFontToolbarFromSelection(e.newSelection);
    });

    // Assegura roteamento ortogonal em 90° para novas conexões
    try {
      modeler.get('eventBus').on('commandStack.connection.create.postExecuted', (event) => {
        const conn = event.context && event.context.connection;
        if (conn && conn.type === 'bpmn:SequenceFlow') {
          try { modeler.get('modeling').layoutConnection(conn); } catch (e) {}
        }
      });
    } catch (e) {}

    // Converte automaticamente conexões diagonais para curvas de 90°
    function enforceOrthogonalConnections() {
      try {
        const elementRegistry = modeler.get('elementRegistry');
        const modeling = modeler.get('modeling');
        const conns = elementRegistry.filter(el => {
          if (!el.waypoints || el.waypoints.length !== 2) return false;
          const p1 = el.waypoints[0];
          const p2 = el.waypoints[1];
          return Math.abs(p1.x - p2.x) > 5 && Math.abs(p1.y - p2.y) > 5;
        });
        if (conns.length > 0) {
          conns.forEach(conn => {
            try { modeling.layoutConnection(conn); } catch (e) {}
          });
        }
      } catch (e) {}
    }

    // Mapa de estilos tipográficos específicos por elemento: elementId -> fontSize, isBold, isItalic
    function getSelectedElements() {
      if (!modeler) return [];
      try {
        const selection = modeler.get('selection').get();
        return selection || [];
      } catch (e) {
        return [];
      }
    }

    // Injeta/atualiza regras de estilo CSS específicas para os elementos estilizados
    function applyAllElementFontStyles() {
      const keys = Object.keys(elementFontStyles);
      let cssRules = '';

      const elementRegistry = modeler ? modeler.get('elementRegistry') : null;

      keys.forEach(id => {
        const s = elementFontStyles[id];
        if (!s) return;
        const weight = s.isBold ? 'bold' : 'normal';
        const style = s.isItalic ? 'italic' : 'normal';
        const size = s.fontSize || '12px';

        // Determina ID do rótulo externo (se existir)
        let labelId = id + '_label';
        if (elementRegistry) {
          try {
            const shape = elementRegistry.get(id);
            if (shape && shape.label && shape.label.id) {
              labelId = shape.label.id;
            }
          } catch (e) {}
        }

        cssRules += `
          g[data-element-id="${id}"] text,
          g[data-element-id="${id}"] text tspan,
          g[data-element-id="${id}"] .djs-label,
          g[data-element-id="${id}"] .djs-label tspan,
          g[data-element-id="${labelId}"] text,
          g[data-element-id="${labelId}"] text tspan,
          g[data-element-id="${labelId}"] .djs-label,
          g[data-element-id="${labelId}"] .djs-label tspan {
            font-size: ${size} !important;
            font-weight: ${weight} !important;
            font-style: ${style} !important;
          }
        `;

        // Aplica também diretamente no DOM gráfico dos nós correspondentes
        if (elementRegistry) {
          try {
            const gfx = elementRegistry.getGraphics(id);
            if (gfx) {
              gfx.querySelectorAll('text, tspan').forEach(t => {
                t.style.setProperty('font-size', size, 'important');
                t.style.setProperty('font-weight', weight, 'important');
                t.style.setProperty('font-style', style, 'important');
              });
            }
            if (labelId && labelId !== id) {
              const labelGfx = elementRegistry.getGraphics(labelId);
              if (labelGfx) {
                labelGfx.querySelectorAll('text, tspan').forEach(t => {
                  t.style.setProperty('font-size', size, 'important');
                  t.style.setProperty('font-weight', weight, 'important');
                  t.style.setProperty('font-style', style, 'important');
                });
              }
            }
          } catch (e) {}
        }
      });

      // 1. Atualiza folha de estilo no documento para visualização imediata no canvas
      let styleTag = document.getElementById('diagram-font-override');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'diagram-font-override';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = cssRules;

      // 2. Injeta bloco de estilo no SVG <defs> para exportações SVG
      try {
        const svgEl = document.querySelector('#canvas svg');
        if (svgEl) {
          let defs = svgEl.querySelector('defs');
          if (!defs) {
            defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            svgEl.insertBefore(defs, svgEl.firstChild);
          }
          let svgStyle = defs.querySelector('#svg-font-style');
          if (!svgStyle) {
            svgStyle = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            svgStyle.setAttribute('id', 'svg-font-style');
            svgStyle.setAttribute('type', 'text/css');
            defs.appendChild(svgStyle);
          }
          svgStyle.textContent = cssRules;
        }
      } catch (e) {
        console.warn('Erro ao atualizar estilos tipográficos do SVG:', e);
      }
    }

    const applyDiagramFont = applyAllElementFontStyles;

    function updateFontToolbarFromSelection(selection) {
      if (!fontSizeSelect || !btnFontBold || !btnFontItalic) return;
      if (!selection || selection.length === 0) {
        fontSizeSelect.value = '12px';
        btnFontBold.classList.remove('active');
        btnFontItalic.classList.remove('active');
        return;
      }
      if (selection.length === 1) {
        const s = elementFontStyles[selection[0].id];
        if (s) {
          fontSizeSelect.value = s.fontSize || '12px';
          btnFontBold.classList.toggle('active', !!s.isBold);
          btnFontItalic.classList.toggle('active', !!s.isItalic);
          return;
        }
      }
      const allBold = selection.every(el => elementFontStyles[el.id] && elementFontStyles[el.id].isBold);
      const allItalic = selection.every(el => elementFontStyles[el.id] && elementFontStyles[el.id].isItalic);
      btnFontBold.classList.toggle('active', allBold);
      btnFontItalic.classList.toggle('active', allItalic);
      const firstSize = (elementFontStyles[selection[0].id] && elementFontStyles[selection[0].id].fontSize) || '12px';
      const sameSize = selection.every(el => ((elementFontStyles[el.id] && elementFontStyles[el.id].fontSize) || '12px') === firstSize);
      fontSizeSelect.value = sameSize ? firstSize : '12px';
    }

    function setFontSize(val) {
      const selection = getSelectedElements();
      if (selection.length === 0) {
        showToast('Selecione um ou mais elementos para alterar o tamanho da fonte.');
        if (fontSizeSelect) fontSizeSelect.value = '12px';
        return;
      }
      selection.forEach(el => {
        if (!elementFontStyles[el.id]) {
          elementFontStyles[el.id] = { fontSize: '12px', isBold: false, isItalic: false };
        }
        elementFontStyles[el.id].fontSize = val;
      });
      applyAllElementFontStyles();
      showToast(`Tamanho da fonte (${val}) aplicado a ${selection.length} elemento(s).`);
    }

    function toggleBold() {
      const selection = getSelectedElements();
      if (selection.length === 0) {
        showToast('Selecione um ou mais elementos para alternar negrito.');
        return;
      }
      const allBold = selection.every(el => elementFontStyles[el.id] && elementFontStyles[el.id].isBold);
      const newBold = !allBold;
      selection.forEach(el => {
        if (!elementFontStyles[el.id]) {
          elementFontStyles[el.id] = { fontSize: '12px', isBold: false, isItalic: false };
        }
        elementFontStyles[el.id].isBold = newBold;
      });
      if (btnFontBold) btnFontBold.classList.toggle('active', newBold);
      applyAllElementFontStyles();
      showToast(`Negrito ${newBold ? 'ativado' : 'desativado'} em ${selection.length} elemento(s).`);
    }

    function toggleItalic() {
      const selection = getSelectedElements();
      if (selection.length === 0) {
        showToast('Selecione um ou mais elementos para alternar itálico.');
        return;
      }
      const allItalic = selection.every(el => elementFontStyles[el.id] && elementFontStyles[el.id].isItalic);
      const newItalic = !allItalic;
      selection.forEach(el => {
        if (!elementFontStyles[el.id]) {
          elementFontStyles[el.id] = { fontSize: '12px', isBold: false, isItalic: false };
        }
        elementFontStyles[el.id].isItalic = newItalic;
      });
      if (btnFontItalic) btnFontItalic.classList.toggle('active', newItalic);
      applyAllElementFontStyles();
      showToast(`Itálico ${newItalic ? 'ativado' : 'desativado'} em ${selection.length} elemento(s).`);
    }

    async function loadXML(xml) {
      try {
        const result = await modeler.importXML(xml);
        if (result.warnings && result.warnings.length) {
          console.warn('bpmn-js import warnings:', result.warnings);
        }
        elementFontStyles = {};
        updateFontToolbarFromSelection([]);
        enforceOrthogonalConnections();
        applyDiagramFont();
        try { modeler.get('commandStack').clear(); } catch (e) {}
        clearError();
        updateUndoRedo();
      } catch (err) {
        showError(err);
        return;
      }
      setTimeout(() => {
        try {
          modeler.get('canvas').zoom('fit-viewport');
        } catch (err) {
          console.warn('fit-viewport failed (diagram still imported correctly):', err);
        }
      }, 100);
    }

    document.getElementById('btn-download').addEventListener('click', async () => {
      try {
        const { xml } = await modeler.saveXML({ format: true });
        const blob = new Blob([xml], { type: 'application/xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'PLACEHOLDER_PROCESS_NAME.bpmn';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById('btn-export-svg').addEventListener('click', async () => {
      try {
        applyDiagramFont();
        const { svg } = await modeler.saveSVG({ format: true });
        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'PLACEHOLDER_PROCESS_NAME.svg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        showError(err);
      }
    });

    fontSizeSelect.addEventListener('change', (e) => setFontSize(e.target.value));
    btnFontBold.addEventListener('click', toggleBold);
    btnFontItalic.addEventListener('click', toggleItalic);

    document.getElementById('btn-reset').addEventListener('click', () => loadXML(ORIGINAL_BPMN_XML));

    btnUndo.addEventListener('click', () => {
      try {
        const cs = modeler.get('commandStack');
        if (cs.canUndo()) cs.undo();
      } catch (e) {}
    });

    btnRedo.addEventListener('click', () => {
      try {
        const cs = modeler.get('commandStack');
        if (cs.canRedo()) cs.redo();
      } catch (e) {}
    });

    document.getElementById('btn-route-90').addEventListener('click', () => {
      try {
        const selection = modeler.get('selection').get();
        const modeling = modeler.get('modeling');
        const connections = selection.filter(el => el.waypoints);
        if (connections.length > 0) {
          connections.forEach(conn => modeling.layoutConnection(conn));
        } else {
          const elementRegistry = modeler.get('elementRegistry');
          const allConns = elementRegistry.filter(el => el.waypoints && (el.type === 'bpmn:SequenceFlow' || el.type === 'bpmn:MessageFlow' || el.type === 'bpmn:Association'));
          allConns.forEach(conn => modeling.layoutConnection(conn));
        }
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      try {
        const canvas = modeler.get('canvas');
        canvas.zoom(canvas.zoom() * 1.25);
      } catch (e) {}
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      try {
        const canvas = modeler.get('canvas');
        canvas.zoom(canvas.zoom() * 0.8);
      } catch (e) {}
    });

    document.getElementById('btn-zoom-fit').addEventListener('click', () => {
      try {
        modeler.get('canvas').zoom('fit-viewport');
      } catch (e) {}
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      const isCtrlOrMeta = e.ctrlKey || e.metaKey;
      if (isCtrlOrMeta && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        try { modeler.get('commandStack').undo(); } catch (err) {}
      } else if (isCtrlOrMeta && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
        e.preventDefault();
        try { modeler.get('commandStack').redo(); } catch (err) {}
      } else if (isCtrlOrMeta && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        toggleBold();
      } else if (isCtrlOrMeta && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        toggleItalic();
      }
    });

    // Permite rolagem horizontal da barra pelo scroll vertical do mouse quando houver overflow
    const toolbarEl = document.getElementById('toolbar');
    if (toolbarEl) {
      toolbarEl.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0 && toolbarEl.scrollWidth > toolbarEl.clientWidth) {
          e.preventDefault();
          toolbarEl.scrollLeft += e.deltaY;
        }
      }, { passive: false });
    }

    loadXML(ORIGINAL_BPMN_XML);
  }
</script>
</body>
</html>
